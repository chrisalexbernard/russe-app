<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F3F4F7; font-family: 'PT Sans', sans-serif; color: #161B2E">
<main style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 20px">

<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>

<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: #5A6074">Date du cours
<input type="text" value="03/10/2026" style="height: 44px; border: 1px solid #D5D8E0; border-radius: 10px; padding: 0 12px; font: inherit; font-size: 16px; color: #161B2E"></label>
<a href="Dictionary.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; border-radius: 12px; background: #B42A22; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
Valider la leçon {{next}}</a>
</section>

<section style="display: flex; flex-direction: column; gap: 2px; background: #FFFFFF; border-radius: 16px; padding: 8px 12px">
<h2 style="margin: 8px 4px 6px; font-size: 13px; color: #5A6074; text-transform: uppercase; letter-spacing: 0.04em">Les 28 leçons du livre</h2>
<sc-for list="{{lessons}}" as="l" hint-placeholder-count="10">
<div style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 4px; border-top: 1px solid #F0F1F4">
<span style="display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 15px; flex-shrink: 0; font-size: 13px; font-weight: 700; {{l.dotStyle}}">{{l.mark}}</span>
<span style="font-family: 'PT Serif', serif; font-size: 16px; font-weight: 700; flex-grow: 1; {{l.titleStyle}}">Урок {{l.n}}</span>
<span style="font-size: 13px; {{l.subStyle}}">{{l.sub}}</span>

</sc-for>
</section>
</main>
<nav style="display: flex; justify-content: space-around; align-items: center; height: 76px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E4EA; padding: 0 8px 8px">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; color: #5A6074">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Accueil</a>
<a href="Dictionary.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; color: #5A6074">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A1.5 1.5 0 0 1 5.5 3H20v15H5.5A1.5 1.5 0 0 0 4 19.5z"></path><path d="M4 19.5A1.5 1.5 0 0 0 5.5 21H20"></path></svg>Dico</a>
<a href="LogLesson.dc.html" aria-label="Valider une leçon" style="display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 26px; background: #B42A22; color: #FFFFFF">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></a>
<a href="Grammar.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 64px; min-height: 52px; text-decoration: none; font-size: 12px; color: #5A6074">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 4v16"></path></svg>Grammaire</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lessonsDone":{"editor":"int","default":6,"min":1,"max":27,"section":"Démo"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { data: null };
}
componentDidMount() {
this.loadDict();
}
loadDict() {
fetch('/_blob/20a388f53ee5cb9a1808aff46657be5e').then((r) => r.json()).then((d) => this.setState({ data: d })).catch(() => this.setState({ failed: true }));
}
strip(s) {
return s.replace(/́/g, '');
}
sortKey(w) {
return this.strip(w.ru).toLowerCase().replace(/^\(к\)\s*/, '').replace(/^[^а-яё]+/, '');
}
tag(t) {
const m = { nm: ['nom m.', 'n'], nf: ['nom f.', 'n'], nn: ['nom n.', 'n'], npl: ['nom pl.', 'n'], v: ['verbe', 'v'], adj: ['adjectif', 'o'], adv: ['adverbe', 'o'], pron: ['pronom', 'o'], prep: ['préposition', 'o'], conj: ['conjonction', 'o'], num: ['nombre', 'o'], part: ['particule', 'o'], expr: ['expression', 'e'] };
const s = { n: 'background: #E4E9F7; color: #1C3488', v: 'background: #FBE6E4; color: #8E2019', e: 'background: #E3F1EC; color: #1B5E4C', o: 'background: #EEEFF3; color: #3A4056' };
const x = m[t] || ['', 'o'];
return { label: x[0], style: s[x[1]], kind: x[1] };
}
split(forms) {
const real = forms.filter((f) => f && f !== '—');
let p = real[0] || '';
real.forEach((f) => { while (p && f.indexOf(p) !== 0) p = p.slice(0, -1); });
return forms.map((f) => (f === '—' ? { stem: '—', end: '', full: '—' } : { stem: f.slice(0, p.length), end: f.slice(p.length), full: f }));
}
conj(v, tense, inf) {
const P = { pres: ['я', 'ты', 'он / она', 'мы', 'вы', 'они'], fut: ['я', 'ты', 'он / она', 'мы', 'вы', 'они'], past: ['он', 'она', 'оно', 'они'], imp: ['ты', 'вы'] };
if (tense === 'fut') {
const b = ['буду', 'будешь', 'будет', 'будем', 'будете', 'будут'];
return this.split(b).map((f, i) => ({ p: P.fut[i], stem: f.stem, end: f.end, rest: ' ' + inf, cur: f.full + ' ' + inf }));
}
const forms = tense === 'pres' ? v.pres : tense === 'past' ? v.past : v.imp;
return this.split(forms).map((f, i) => ({ p: P[tense][i], stem: f.stem, end: f.end, rest: '', cur: f.full }));
}
verbInfo(v) {
if (!v) return '';
const g = v.g === 'irr' ? 'irrégulier' : v.g === '1' ? '1re conjugaison' : '2e conjugaison';
return (v.a === 'pf' ? 'Perfectif' : 'Imperfectif') + ' · ' + g + (v.pair ? ' · ' + (v.a === 'pf' ? 'imperf. : ' : 'perf. : ') + v.pair : '');
}
item(w, data, open, mode) {
const key = this.strip(w.ru);
const t = this.tag(w.t);
const v = w.t === 'v' ? data.verbs[key] : null;
const isOpen = !!v && open === key;
return {
ru: w.ru, cur: key, fr: w.fr, l: w.l, tagLabel: t.label, tagStyle: t.style, kind: t.kind,
isVerb: !!v, isOpen, span: isOpen ? '1 / -1' : 'auto',
showPrint: mode !== 'cursive', showCursive: mode !== 'print',
toggle: () => this.setState({ open: isOpen ? '' : key }),
toggleLabel: isOpen ? 'Masquer la conjugaison' : 'Voir la conjugaison',
info: this.verbInfo(v),
presLabel: v && v.a === 'pf' ? 'Futur' : 'Présent',
pres: isOpen ? this.conj(v, 'pres') : [],
past: isOpen ? this.conj(v, 'past') : [],
note: v ? v.note : ''
};
}
seg(list, cur, key) {
const on = 'background: #FFFFFF; color: #161B2E; box-shadow: 0 1px 2px rgba(22,27,46,0.12)';
const off = 'background: transparent; color: #5A6074';
return list.map(([id, label]) => ({ label, style: id === cur ? on : off, pick: () => this.setState({ [key]: id }) }));
}
chips(list, cur, key) {
return list.map(([id, label]) => ({
label,
style: id === cur ? 'background: #161B2E; color: #FFFFFF; border: 1px solid #161B2E' : 'background: #FFFFFF; color: #161B2E; border: 1px solid #D5D8E0',
pick: () => this.setState({ [key]: id })
}));
}
renderVals() {
const data = this.state.data;
const done = Math.min(27, Math.max(1, this.props.lessonsDone ?? 6));
const next = done + 1;
const count = (n) => (data ? data.words.filter((w) => w.l === n).length : 0);
const lessons = [];
for (let n = 1; n <= 28; n++) {
const isDone = n <= done;
const isNext = n === next;
lessons.push({
n,
mark: isDone ? '✓' : String(n),
sub: isDone ? count(n) + ' mots' : isNext ? 'À valider' : 'Verrouillée',
dotStyle: isDone ? 'background: #E3F1EC; color: #1B5E4C' : isNext ? 'background: #B42A22; color: #FFFFFF' : 'background: #ECEEF2; color: #6B7186',
titleStyle: isDone || isNext ? 'color: #161B2E' : 'color: #6B7186',
subStyle: isDone ? 'color: #1B5E4C' : isNext ? 'color: #8E2019; font-weight: 700' : 'color: #6B7186'
});
}
return {
next, lessons,
nextWords: data ? count(next) : '…',
nextVerbs: data ? data.words.filter((w) => w.l === next && w.t === 'v').length : '…'
};
}
}
</script>
